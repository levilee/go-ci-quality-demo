name: Open Code Review Historical PR Report

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: open-code-review-history-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Resolve PR context
        id: pr-context
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed(`Invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('pr_number', String(pr.number));
            core.setOutput('pr_title', pr.title);
            core.setOutput('pr_url', pr.html_url);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);

      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-context.outputs.base_sha }}
          fetch-depth: 0

      - name: Prepare review range
        id: git-range
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          BASE_SHA: ${{ steps.pr-context.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/ocr-pr-${PR_NUMBER}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          MERGE_BASE="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          echo "merge_base=${MERGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "Review range: ${MERGE_BASE}..${HEAD_SHA}"

      - name: Run Open Code Review
        id: ocr
        continue-on-error: true
        shell: bash
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          MERGE_BASE: ${{ steps.git-range.outputs.merge_base }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr-context.outputs.pr_title }}
        run: |
          set +e
          npm install --global '@alibaba-group/open-code-review@1.7.16'
          ocr config set language Chinese
          ocr review \
            --from "$MERGE_BASE" \
            --to "$HEAD_SHA" \
            --format text \
            --audience agent \
            --background "Review historical PR #${PR_NUMBER}: ${PR_TITLE}" \
            > ocr-report.txt 2> ocr-stderr.log
          OCR_EXIT_CODE=$?
          set -e
          echo "ocr_exit_code=${OCR_EXIT_CODE}" >> "$GITHUB_OUTPUT"
          echo "OCR exit code: ${OCR_EXIT_CODE}"
          exit 0

      - name: Add report to Actions Summary
        if: always()
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr-context.outputs.pr_title }}
          MERGE_BASE: ${{ steps.git-range.outputs.merge_base }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          OCR_EXIT_CODE: ${{ steps.ocr.outputs.ocr_exit_code }}
        run: |
          {
            echo "## Open Code Review Report"
            echo
            echo "- PR: #${PR_NUMBER} - ${PR_TITLE}"
            echo "- Review range: ${MERGE_BASE}..${HEAD_SHA}"
            echo "- OCR exit code: ${OCR_EXIT_CODE:-unknown}"
            echo
            if [ -s ocr-report.txt ]; then
              cat ocr-report.txt
            elif [ -s ocr-stderr.log ]; then
              echo "### OCR diagnostics"
              echo
              echo '```text'
              cat ocr-stderr.log
              echo '```'
            else
              echo "No OCR output was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OCR report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-history-report-${{ github.run_id }}
          path: |
            ocr-report.txt
            ocr-stderr.log
          if-no-files-found: warn
