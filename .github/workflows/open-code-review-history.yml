name: Open Code Review Historical PR Report

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: open-code-review-history-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Resolve PR context
        id: pr-context
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed(`Invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('pr_number', String(pr.number));
            core.setOutput('pr_title', pr.title);
            core.setOutput('pr_url', pr.html_url);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);

      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-context.outputs.base_sha }}
          fetch-depth: 0

      - name: Prepare review range
        id: git-range
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          BASE_SHA: ${{ steps.pr-context.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/ocr-pr-${PR_NUMBER}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          MERGE_BASE="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          echo "merge_base=${MERGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "Review range: ${MERGE_BASE}..${HEAD_SHA}"

      - name: Run Open Code Review
        id: ocr
        continue-on-error: true
        shell: bash
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          MERGE_BASE: ${{ steps.git-range.outputs.merge_base }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr-context.outputs.pr_title }}
        run: |
          set +e
          npm install --global '@alibaba-group/open-code-review@1.7.16'
          ocr config set language Chinese
          ocr review \
            --from "$MERGE_BASE" \
            --to "$HEAD_SHA" \
            --format json \
            --audience agent \
            --background "Review historical PR #${PR_NUMBER}: ${PR_TITLE}" \
            > ocr-result.json 2> ocr-stderr.log
          OCR_EXIT_CODE=$?
          set -e
          echo "ocr_exit_code=${OCR_EXIT_CODE}" >> "$GITHUB_OUTPUT"
          echo "OCR exit code: ${OCR_EXIT_CODE}"
          exit 0

      - name: Render report
        if: always()
        shell: bash
        env:
          OCR_PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          OCR_PR_TITLE: ${{ steps.pr-context.outputs.pr_title }}
          OCR_PR_URL: ${{ steps.pr-context.outputs.pr_url }}
          OCR_MERGE_BASE: ${{ steps.git-range.outputs.merge_base }}
          OCR_HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          OCR_EXIT_CODE: ${{ steps.ocr.outputs.ocr_exit_code }}
        run: |
          node scripts/ci/render-ocr-history-report.js \
            --result ocr-result.json \
            --stderr ocr-stderr.log \
            --output ocr-report.md

      - name: Add report to Actions Summary
        if: always()
        shell: bash
        run: cat ocr-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OCR report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-history-report-${{ github.run_id }}
          path: |
            ocr-report.md
            ocr-result.json
            ocr-stderr.log
          if-no-files-found: warn

      - name: Comment report on target PR
        if: always() && steps.pr-context.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- ocr-history-report -->';
            const report = fs.existsSync('ocr-report.md')
              ? fs.readFileSync('ocr-report.md', 'utf8').slice(0, 50000)
              : 'Report file was not generated.';
            const body = `${marker}\n${report}\n\nFull artifacts and logs: ${process.env.RUN_URL}`;
            const issueNumber = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.reverse().find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
