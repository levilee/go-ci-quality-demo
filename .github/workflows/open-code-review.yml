name: Open Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: >-
    ${{
      (
        github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && startsWith(github.event.comment.body, '/open-code-review')
      )
      && format('open-code-review-pr-{0}', github.event.issue.number)
      || format('open-code-review-noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  code-review:
    if: |
      github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && (
        github.event.comment.author_association == 'MEMBER'
        || github.event.comment.author_association == 'OWNER'
        || github.event.comment.author_association == 'COLLABORATOR'
      )
      && startsWith(github.event.comment.body, '/open-code-review')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Open Code Review from PR comment
        uses: alibaba/open-code-review@1b193db3587e4d3f429bd8c8213479d63e3b4f21
        with:
          github_token: ${{ github.token }}
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          language: Chinese
          ocr_version: 1.7.16
          review_concurrency: '4'
          sticky_summary: 'true'
          incremental: 'true'
          upload_artifacts: 'true'
